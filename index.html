<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>درس جمع العشرات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@700&text=%D9%A0%D9%A1%D9%A2%D9%A3%D9%A4%D9%A5%D9%A6%D9%A7%D9%A8%D9%A9&display=block">
<style>
/* Layout: sticky lesson bar with 5 timed stages; one stage visible at a time, built for a class screen and phones */
:root{
  --bg:#f2f8f7; --surface:#ffffff; --ink:#173c3a; --muted:#5d7a77; --line:#d3e6e3;
  --teal:#009688; --teal-soft:#d9f1ee; --rod:#f07a2a; --rod-edge:#c85a12; --sun:#ffc93c; --sun-soft:#fff3cc;
  --good:#1f9d55; --bad:#d64545; --blue:#1f4fa3; --plus:#c2185b; --ones:#18a058;
  --display:"Noto Naskh Arabic","Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif; --body:"Noto Naskh Arabic","Tajawal",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1d1c; --surface:#172a29; --ink:#e3f2f0; --muted:#94b3af; --line:#29403e;
  --teal:#2bbbad; --teal-soft:#1d3a37; --rod:#f28b45; --rod-edge:#b75415; --sun:#ffd25e; --sun-soft:#3a3218;
  --good:#3ec27a; --bad:#ef6b6b; --blue:#6f9cf0; --plus:#ff6fa8; --ones:#3ec27a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1d1c; --surface:#172a29; --ink:#e3f2f0; --muted:#94b3af; --line:#29403e;
  --teal:#2bbbad; --teal-soft:#1d3a37; --rod:#f28b45; --rod-edge:#b75415; --sun:#ffd25e; --sun-soft:#3a3218;
  --good:#3ec27a; --bad:#ef6b6b; --blue:#6f9cf0; --plus:#ff6fa8; --ones:#3ec27a; color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--teal)}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--teal);color:#fff;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.badge{background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;border-radius:999px;padding:2px 14px;font-size:18px}
.bar h1{font-family:var(--display);font-size:clamp(22px,4vw,30px);margin:0;font-weight:800}
.clock{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border-radius:12px;padding:4px 6px 4px 12px}
.clock b{font-family:var(--display);font-size:24px;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.clock button{border:0;background:#fff;color:var(--teal);border-radius:9px;padding:4px 12px;font-weight:800}
.steps{display:flex;gap:6px;max-width:1100px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
.step{flex:1 0 auto;border:0;border-radius:10px;padding:6px 12px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;justify-content:center}
.step small{opacity:.8;font-weight:500}
.step.on{background:#fff;color:var(--teal)}
.step.done{background:rgba(255,255,255,.32)}

main{max-width:1100px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{display:grid;gap:18px}
.stage-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stage-head h2{font-family:var(--display);font-size:clamp(26px,5vw,36px);margin:0;color:var(--teal);font-weight:800}
.ribbon{background:var(--bad);color:var(--sun);font-family:var(--display);font-weight:800;border-radius:999px 8px 8px 999px;padding:2px 18px;font-size:20px}
.goal{color:var(--muted);margin:0;flex-basis:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}

/* tens rods */
.rods{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;justify-content:center;min-height:120px}
.rod{width:16px;display:grid;grid-template-rows:repeat(10,10px);border:2px solid var(--rod-edge);border-radius:3px;background:var(--rod-edge);gap:1px;animation:pop .35s ease both}
.rod i{background:var(--rod)}
.rod.b{--rod:#3aa0e8;--rod-edge:#1e6fae}
@keyframes pop{from{transform:translateY(-14px) scale(.8);opacity:.3}to{transform:none;opacity:1}}
.group-gap{width:22px}

.eq{font-family:var(--display);font-size:clamp(26px,5.5vw,40px);font-weight:800;text-align:center;line-height:1.5;font-variant-numeric:tabular-nums}
.eq .t{background:var(--sun-soft);border-radius:8px;padding:0 8px}
.eq .ans{color:var(--teal);border-bottom:3px dashed var(--teal);min-width:1.6em;display:inline-block}
.small-eq{font-size:clamp(20px,4vw,28px);color:var(--muted)}
.robot{display:flex;gap:12px;align-items:center;background:var(--teal-soft);border-radius:16px;padding:12px 16px}
.robot .face{font-size:38px;line-height:1}
.robot p{margin:0;font-weight:700}

.btn{border:0;border-radius:12px;padding:10px 20px;font-weight:800;font-size:17px;background:var(--teal);color:#fff}
.btn.alt{background:var(--teal-soft);color:var(--teal)}
.btn.sun{background:var(--sun);color:#3b2a00}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.flash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:center;font-family:var(--display);font-size:28px;font-weight:800;color:var(--ink)}
.card .a{color:var(--teal)}
.card.shown{border-color:var(--teal);background:var(--teal-soft)}

/* builder */
.builder{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side{display:grid;gap:10px;justify-items:center;border:2px dashed var(--line);border-radius:16px;padding:12px}
.side h3{margin:0;font-size:16px;color:var(--muted)}
.stepper{display:flex;gap:10px;align-items:center}
.stepper button{width:44px;height:44px;border-radius:50%;border:0;font-size:26px;font-weight:800;background:var(--teal);color:#fff}
.stepper b{font-family:var(--display);font-size:28px;min-width:2ch;text-align:center}

/* quiz */
.qnum{background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;border-radius:8px;padding:0 12px;font-size:20px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 4px;font-family:var(--display);font-size:clamp(26px,6vw,40px);font-weight:800}
.opt:hover{border-color:var(--teal)}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .3s}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.dots{display:flex;gap:6px;justify-content:center}
.dots span{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots span.ok{background:var(--good)} .dots span.cur{background:var(--sun)}
.msg{text-align:center;font-weight:800;min-height:1.6em;font-size:19px}
.msg.ok{color:var(--good)} .msg.no{color:var(--bad)}

/* practice grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.vert{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 16px 12px;color:var(--ink);font-family:var(--display);font-weight:800;font-size:46px;display:grid;line-height:1.2}
.vert .n{justify-self:start;font-size:15px;line-height:1.6;background:var(--blue);color:#fff;border-radius:6px;padding:0 8px}
.vert .pl{direction:rtl;display:flex;justify-content:space-between;align-items:center}
.vert .op{min-width:1ch}
.vert .plus{color:var(--plus);font-size:52px}
.vert .ln{border-top:4px solid var(--ink);width:100%;margin-top:4px;padding-top:2px;text-align:left;color:var(--teal);min-height:1.2em;direction:ltr}

/* place value */
.pv{display:flex;direction:ltr;justify-content:center;gap:clamp(12px,4vw,40px)}
.pv-col{display:grid;justify-items:center;gap:10px}
.digit{font-family:var(--display);font-weight:800;font-size:clamp(130px,36vw,260px);line-height:1.15;border-radius:24px;border:4px solid;background:var(--surface);min-width:1.1em;text-align:center;transition:opacity .2s}
.pv-col.t .digit{color:var(--rod);border-color:var(--rod)}
.pv-col.o .digit{color:var(--ones);border-color:var(--ones)}
.digit.zero{opacity:.3}
.pv-col .lbl{font-size:clamp(20px,4vw,28px);font-weight:800;padding:2px 22px;border-radius:999px;color:#fff;direction:rtl}
.pv-col.t .lbl{background:var(--rod)} .pv-col.o .lbl{background:var(--ones)}
.pv-col .stepper button{width:52px;height:52px}
.pv-col.t .stepper button{background:var(--rod)} .pv-col.o .stepper button{background:var(--ones)}
.tc{color:var(--rod)} .oc{color:var(--ones)}
.cubes{display:flex;flex-wrap:wrap;gap:4px;max-width:120px;align-content:flex-end}
.cube{width:16px;height:16px;background:var(--ones);border:2px solid rgba(0,0,0,.25);border-radius:3px;animation:pop .3s ease both}
.vert.shown{border-color:var(--teal);background:var(--teal-soft)}
.vert .hint{font-family:var(--body);font-size:17px;font-weight:700;color:var(--muted);text-align:center;direction:rtl;display:block}
.vert.counting{border-color:var(--blue)}
.vert .top{display:flex;justify-content:space-between;align-items:center;direction:rtl;min-height:40px}
.vert .cd{display:inline-flex;align-items:center;gap:4px;background:var(--blue);color:#fff;border-radius:999px;padding:0 12px;font-size:30px;line-height:1.3;font-variant-numeric:tabular-nums}
.vert .cd small{font-family:var(--body);font-size:13px;font-weight:700}
.story{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.carrot{font-size:56px}

/* game */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{border-radius:18px;padding:12px;text-align:center;border:3px solid transparent;background:var(--surface)}
.team h3{margin:0;font-family:var(--display);font-size:22px}
.team .sc{font-family:var(--display);font-size:46px;font-weight:800;line-height:1.1}
.team.a{color:var(--teal)} .team.b{color:var(--blue)}
.team.turn{border-color:var(--sun);box-shadow:0 0 0 4px var(--sun-soft)}
.gq{font-size:clamp(40px,9vw,70px)}
.tbar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--sun);transition:width .2s linear}
.win{text-align:center;font-family:var(--display);font-size:clamp(30px,6vw,48px);font-weight:800;color:var(--teal)}
/* car race */
.setup{display:grid;gap:18px}
.setup b{font-size:19px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{min-width:56px;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:4px 14px;font-family:var(--display);font-size:28px;font-weight:800}
.chip.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center;min-height:40px}
.pc svg{width:90px;display:block}
.hero-car{width:100%;max-height:240px;object-fit:cover;border-radius:16px;display:block}
.track{display:grid;gap:10px;margin-bottom:16px}
.lane-wrap{border-radius:14px;padding:4px 6px 6px;border:3px solid transparent}
.lane-wrap.turn{border-color:var(--sun);background:var(--sun-soft)}
.lane-name{font-weight:800;font-size:16px;display:flex;justify-content:space-between}
.lane-name small{color:var(--muted);font-size:14px}
.road{position:relative;height:74px;border-radius:10px;background:
  repeating-linear-gradient(90deg,#fff 0 18px,transparent 18px 34px) center 30px/100% 3px no-repeat,
  #4b5157;border-right:6px solid #fff;overflow:hidden}
.road::before{content:"";position:absolute;inset:0 auto 0 0;width:14px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/14px 14px}
.car{position:absolute;bottom:2px;width:90px;transition:right .7s cubic-bezier(.3,.8,.4,1)}
.car svg{width:90px;display:block;overflow:visible}
.car.stop{animation:shake .3s 2}
.tl{position:absolute;top:3px;width:14px;height:34px;background:#1d1d1d;border-radius:4px;display:inline-grid;gap:2px;padding:2px;z-index:1}
.preview .tl{position:static}
.tl i{border-radius:50%;background:#444}
.tl.red i:nth-child(1){background:#ff3b30;box-shadow:0 0 6px #ff3b30}
.tl.amber i:nth-child(2){background:#ffb300}
.tl.green i:nth-child(3){background:#2ee86a;box-shadow:0 0 6px #2ee86a}
.racers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
.racer{display:grid;gap:8px;border:3px solid var(--car);border-radius:14px;padding:6px 10px;background:var(--surface);min-width:0}
.racer-top{display:flex;align-items:center;gap:10px;min-width:0}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.racer input{flex:1;min-width:0;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);font-family:var(--body);font-size:20px;font-weight:700;padding:4px 2px}
.racer input:focus{outline:none;border-color:var(--car)}
.gclock{display:flex;justify-content:center;align-items:center;gap:12px;font-weight:800;margin-bottom:10px;font-size:18px}
.gclock b{font-family:var(--display);font-size:40px;background:var(--teal);color:#fff;border-radius:14px;padding:0 18px;font-variant-numeric:tabular-nums}
.gclock.low b{background:var(--bad);animation:shake .4s}
.qbox{display:grid;gap:12px}
.whose{color:#fff;border-radius:999px;padding:2px 14px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
.next-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:520px){.builder,.teams{gap:8px}.rod{width:12px;grid-template-rows:repeat(10,8px)}.opts{gap:8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="bar">
  <div class="bar-top">
    <span class="badge">٥-١</span>
    <h1>جمع العشرات</h1>
    <div class="clock" aria-label="مؤقت المرحلة">
      <b id="clk">٣:٠٠</b>
      <button id="clkBtn">ابدأ</button>
    </div>
  </div>
  <nav class="steps" id="steps"></nav>
</header>

<main id="main"></main>

<canvas class="confetti" id="conf" aria-hidden="true"></canvas>

<script>
const AR='٠١٢٣٤٥٦٧٨٩';
const ar=n=>String(n).replace(/\d/g,d=>AR[d]);
const $=s=>document.querySelector(s);
const rods=(n,cls='')=>Array.from({length:n},()=>`<div class="rod ${cls}">${'<i></i>'.repeat(10)}</div>`).join('');
const tensWord=n=>n===1?'عشرة':n===2?'عشرتان':(n<=10?'عشرات':'عشرة');

/* ---------- sound ---------- */
let ac;function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='triangle';
const t=ac.currentTime;if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.1)}else{o.frequency.setValueAtTime(220,t)}
g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.32)}catch(e){}}

/* ---------- stages ---------- */
const STAGES=[
 {key:'ready',name:'أستعد',min:3},
 {key:'explore',name:'أستكشف',min:5},
 {key:'check',name:'أتأكد',min:5},
 {key:'train',name:'أتدرب',min:4},
 {key:'play',name:'ألعب',min:3},
 {key:'pv',name:'الآحاد والعشرات',min:0,tool:true},
];
let cur=0,done=new Set();
function nav(){
  $('#steps').innerHTML=STAGES.map((s,i)=>`<button class="step ${i===cur?'on':''} ${done.has(i)?'done':''}" data-i="${i}">${s.name}<small>${s.tool?'أداة':ar(s.min)+' د'}</small></button>`).join('');
  $('#steps').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function go(i){ if(i>cur) for(let k=cur;k<i;k++)done.add(k); cur=i; nav(); resetClock(); render[STAGES[i].key](); window.scrollTo({top:0,behavior:'smooth'}); }
function footer(){
  return `<div class="next-row">
    ${cur>0?`<button class="btn alt" onclick="go(${cur-1})">→ السابق</button>`:'<span></span>'}
    ${STAGES[cur+1]&&!STAGES[cur+1].tool?`<button class="btn" onclick="go(${cur+1})">التالي: ${STAGES[cur+1].name} ←</button>`:''}
  </div>`;
}

/* ---------- clock ---------- */
let left=180,timer=null;
function showClock(){const m=Math.floor(left/60),s=left%60;$('#clk').textContent=ar(m)+':'+ar(String(s).padStart(2,'0'));$('#clk').style.color=left<=30?'var(--sun)':''}
function resetClock(){clearInterval(timer);timer=null;left=STAGES[cur].min*60;$('#clkBtn').textContent='ابدأ';
  if(!STAGES[cur].min){$('#clk').textContent='—';$('#clkBtn').disabled=true;return}
  $('#clkBtn').disabled=false;showClock()}
$('#clkBtn').onclick=()=>{ if(timer){clearInterval(timer);timer=null;$('#clkBtn').textContent='استمر';return}
  $('#clkBtn').textContent='إيقاف';
  timer=setInterval(()=>{left--;showClock();if(left<=0){clearInterval(timer);timer=null;beep(true);$('#clkBtn').textContent='انتهى';}},1000);
};

/* ---------- render ---------- */
const render={};

render.ready=()=>{
  const facts=[[4,2],[6,1],[3,4],[2,5]];
  $('#main').innerHTML=`<section class="stage">
   <div class="stage-head"><span class="ribbon">أستعد</span><h2>حقائق الجمع تساعدني</h2>
   <p class="goal">فكرة الدرس: أستعمل حقائق الجمع لأجمع العشرات.</p></div>
   <div class="panel"><p style="margin:0 0 8px;font-weight:700">أتذكّر حقائق الجمع، اضغط البطاقة لكشف الناتج:</p>
     <div class="flash">${facts.map(([a,b])=>`<button class="card" data-a="${a+b}">${ar(a)} + ${ar(b)} = <span class="a">؟</span></button>`).join('')}</div></div>
   <div class="panel" style="display:grid;gap:14px">
     <p style="margin:0;font-weight:700">أجد ناتج ٥٠ + ٣٠</p>
     <div class="rods">${rods(5)}<span class="group-gap"></span>${rods(3,'b')}</div>
     <div class="eq"><span class="t">${ar(5)}</span> عشرات + <span class="t">${ar(3)}</span> عشرات = <span class="ans" id="r1">؟</span> عشرات</div>
     <div class="eq small-eq">٥٠ + ٣٠ = <span class="ans" id="r2">؟</span></div>
     <div class="robot"><span class="face">🤖</span><p id="rb">أفكّر: ٥ + ٣ = ؟</p></div>
     <div class="btns"><button class="btn sun" id="rev">اكشف الحل</button></div>
   </div>${footer()}</section>`;
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{c.querySelector('.a').textContent=ar(c.dataset.a);c.classList.add('shown');beep(true)});
  $('#rev').onclick=()=>{$('#rb').textContent='أفكّر: ٥ + ٣ = ٨، إذن ٨ عشرات = ٨٠';$('#r1').textContent='٨';setTimeout(()=>$('#r2').textContent='٨٠',500);beep(true)};
};

render.explore=()=>{
  let a=4,b=2;
  $('#main').innerHTML=`<section class="stage">
   <div class="stage-head"><span class="ribbon">أستكشف</span><h2>أبني بالعشرات</h2>
   <p class="goal">أضيف قضبان العشرات في كل مجموعة وألاحظ: نجمع العشرات كما نجمع الآحاد.</p></div>
   <div class="panel" style="display:grid;gap:14px">
     <div class="builder">
       <div class="side"><h3>المجموعة الأولى</h3><div class="rods" id="ra"></div>
         <div class="stepper"><button data-s="a" data-d="1" aria-label="أضف عشرة">+</button><b id="na"></b><button data-s="a" data-d="-1" aria-label="أنقص عشرة">−</button></div></div>
       <div class="side"><h3>المجموعة الثانية</h3><div class="rods" id="rb2"></div>
         <div class="stepper"><button data-s="b" data-d="1" aria-label="أضف عشرة">+</button><b id="nb"></b><button data-s="b" data-d="-1" aria-label="أنقص عشرة">−</button></div></div>
     </div>
     <div class="eq" id="e1"></div>
     <div class="eq small-eq" id="e2"></div>
     <div class="robot"><span class="face">🤖</span><p id="th"></p></div>
     <div class="btns"><button class="btn sun" id="rnd">مسألة عشوائية</button></div>
   </div>
   <div class="panel"><p style="margin:0;font-weight:700">💬 أتحدّث: كيف أستفيد من حقيقة الجمع ٤ + ٥ لأعرف ناتج ٤٠ + ٥٠؟</p></div>
   ${footer()}</section>`;
  const draw=()=>{
    $('#ra').innerHTML=rods(a);$('#rb2').innerHTML=rods(b,'b');$('#na').textContent=ar(a);$('#nb').textContent=ar(b);
    $('#e1').innerHTML=`<span class="t">${ar(a)}</span> ${tensWord(a)} + <span class="t">${ar(b)}</span> ${tensWord(b)} = <span class="ans">${ar(a+b)}</span> ${tensWord(a+b)}`;
    $('#e2').innerHTML=`${ar(a*10)} + ${ar(b*10)} = <span class="ans">${ar((a+b)*10)}</span>`;
    $('#th').textContent=`أفكّر: ${ar(a)} + ${ar(b)} = ${ar(a+b)}، إذن ${ar(a*10)} + ${ar(b*10)} = ${ar((a+b)*10)}`;
  };
  document.querySelectorAll('.stepper button').forEach(btn=>btn.onclick=()=>{
    const d=+btn.dataset.d;
    if(btn.dataset.s==='a'){const n=a+d;if(n>=1&&n+b<=9)a=n}else{const n=b+d;if(n>=1&&a+n<=9)b=n}
    draw();
  });
  $('#rnd').onclick=()=>{a=1+Math.floor(Math.random()*7);b=1+Math.floor(Math.random()*(9-a));draw()};
  draw();
};

function options(ans){
  const set=new Set([ans]);const c=[ans+10,ans-10,ans+20,ans-20].filter(x=>x>=10&&x<=90);
  while(set.size<3&&c.length)set.add(c.splice(Math.floor(Math.random()*c.length),1)[0]);
  return [...set].sort(()=>Math.random()-.5);
}

render.check=()=>{
  const Q=[[40,20],[60,10],[30,40],[20,30],[30,50],[20,20]];
  let i=0,res=[];
  $('#main').innerHTML=`<section class="stage">
   <div class="stage-head"><span class="ribbon">أتأكد</span><h2>أجد ناتج الجمع مستعملًا العشرات</h2>
   <p class="goal">تمارين الكتاب ١ إلى ٦: الطالب يختار الإجابة على السبورة.</p></div>
   <div class="panel" style="display:grid;gap:14px" id="qp"></div>${footer()}</section>`;
  const show=()=>{
    if(i>=Q.length){const ok=res.filter(Boolean).length;
      $('#qp').innerHTML=`<div class="win">أحسنتم! ${ar(ok)} من ${ar(Q.length)} 🎉</div><div class="btns"><button class="btn alt" id="again">أعد التمارين</button></div>`;
      $('#again').onclick=()=>{i=0;res=[];show()};if(ok>=4)confetti();return}
    const [x,y]=Q[i],ans=x+y;let tried=false;
    $('#qp').innerHTML=`<div class="dots">${Q.map((_,k)=>`<span class="${k<i?(res[k]?'ok':''):k===i?'cur':''}"></span>`).join('')}</div>
      <div style="display:flex;gap:10px;align-items:center"><span class="qnum">${ar(i+1)}</span><span style="color:var(--muted);font-weight:700">عُدّ القضبان ثم اختر</span></div>
      <div class="rods">${rods(x/10)}<span class="group-gap"></span>${rods(y/10,'b')}</div>
      <div class="eq"><span class="t">${ar(x/10)}</span> ${tensWord(x/10)} + <span class="t">${ar(y/10)}</span> ${tensWord(y/10)} = <span class="ans" id="qa1">؟</span> ${tensWord(ans/10)}</div>
      <div class="eq small-eq">${ar(x)} + ${ar(y)} = ؟</div>
      <div class="opts">${options(ans).map(o=>`<button class="opt" data-v="${o}">${ar(o)}</button>`).join('')}</div>
      <div class="msg" id="qm"></div>`;
    document.querySelectorAll('#qp .opt').forEach(b=>b.onclick=()=>{
      if(b.classList.contains('ok'))return;
      if(+b.dataset.v===ans){b.classList.add('ok');$('#qa1').textContent=ar(ans/10);$('#qm').className='msg ok';$('#qm').textContent=`صحيح! ${ar(x/10)} + ${ar(y/10)} = ${ar(ans/10)}، إذن الناتج ${ar(ans)}`;beep(true);res[i]=!tried;setTimeout(()=>{i++;show()},1600)}
      else{tried=true;b.classList.add('no');$('#qm').className='msg no';$('#qm').textContent='حاول مرة أخرى، عُدّ العشرات';beep(false)}
    });
  };
  show();
};

render.train=()=>{

   <div class="pgrid">${P.map(([x,y],k)=>`<button class="vert" data-a="${x+y}"><span class="top"><span class="n">${ar(k+8)}</span><span class="cdslot"></span></span><span class="pl"><span class="op"></span><span>${ar(x)}</span></span><span class="pl"><span class="op plus">+</span><span>${ar(y)}</span></span><span class="ln"><span class="hint">اضغط للإجابة</span></span></button>`).join('')}</div>
   <div class="panel story">
     <span class="carrot" aria-hidden="true">🥕</span>
     <div style="display:grid;gap:8px">
       <p style="margin:0"><b style="color:var(--teal)">٢٢ الحسّ العددي:</b> جمعت آمنة ٤٠ جزرة يوم الجمعة، ثم جمعت ١٠ جزرات أخرى يوم السبت. كم جزرة جمعت آمنة في اليومين؟</p>
       <div class="eq small-eq" style="text-align:right">٤٠ + ١٠ = <span class="ans" id="ca">؟</span> جزرة</div>
       <div><button class="btn sun" id="cb">اكشف</button></div>
     </div>
   </div>
   <div class="panel"><b>🏠 نشاط منزلي:</b> كوّن مجموعتين من ١٠ أزرار و٢٠ زرًّا، ثم ادمجهما واكتب جملة الجمع: ١٠ + ٢٠ = ٣٠</div>
   ${footer()}</section>`;
  document.querySelectorAll('.vert').forEach(v=>v.onclick=()=>{
    if(v.dataset.busy)return; v.dataset.busy='1';
    const ln=v.querySelector('.ln'),slot=v.querySelector('.cdslot');let s=15;
    v.classList.add('counting');ln.innerHTML='';
    const tick=()=>{slot.innerHTML=`<span class="cd">${ar(s)}<small>ث</small></span>`};
    tick();
    const id=setInterval(()=>{s--; if(s>0){tick();return}
      clearInterval(id);slot.innerHTML='';v.classList.remove('counting');ln.textContent=ar(v.dataset.a);v.classList.add('shown');beep(true)},1000);
  });
  $('#cb').onclick=()=>{$('#ca').textContent='٥٠';beep(true)};
};

    const num=t?`<span dir="ltr"><span class="tc">${ar(t)}</span><span class="oc">${ar(o)}</span></span>`:`<span class="oc">${ar(o)}</span>`;
    $('#pe2').innerHTML=`<span class="tc">${ar(t*10)}</span> + <span class="oc">${ar(o)}</span> = ${num}`;
  };
  $('#tp').onclick=()=>{t=(t+1)%10;draw()};$('#tm').onclick=()=>{t=(t+9)%10;draw()};
  $('#op').onclick=()=>{o=(o+1)%10;draw()};$('#om').onclick=()=>{o=(o+9)%10;draw()};
  $('#prnd').onclick=()=>{t=1+Math.floor(Math.random()*9);o=Math.floor(Math.random()*10);draw()};
  draw();
};

const heroCache={};let heroImg;
function hexHsl(h){const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;return rgbHsl(r,g,b)}
function rgbHsl(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;const d=mx-mn;
  if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60}return[h,s,l]}
function hslRgb(h,s,l){const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return[f(0),f(8),f(4)]}
function setHero(el,color){
  if(!el)return;
  if(heroCache[color]){el.src=heroCache[color];return}
  const run=()=>{
    const c=document.createElement('canvas');c.width=heroImg.naturalWidth;c.height=heroImg.naturalHeight;
    const x=c.getContext('2d');x.drawImage(heroImg,0,0);const W=c.width,H=c.height;
    const im=x.getImageData(0,0,W,H),d=im.data;const [th,ts,tl]=hexHsl(color);
    for(let i=0;i<d.length;i+=4){
      const px=(i/4)%W/W,py=Math.floor(i/4/W)/H;
      if((px<.13&&py<.46)||(py>.74&&px>.5))continue;
      const [h,s,l]=rgbHsl(d[i]/255,d[i+1]/255,d[i+2]/255);
      const dist=Math.min(Math.abs(h),360-h);
      const w=Math.max(0,Math.min(1,(s-.18)/.2))*Math.max(0,Math.min(1,(40-dist)/10))*Math.max(0,Math.min(1,(l-.06)/.08));
      if(!w)continue;
      let nl=tl<.2?l*.45:Math.min(.92,l*tl/.45), ns=Math.min(1,s*ts/.85);
      const [r,g,b]=hslRgb(th,ns,nl);
      d[i]=d[i]*(1-w)+r*255*w;d[i+1]=d[i+1]*(1-w)+g*255*w;d[i+2]=d[i+2]*(1-w)+b*255*w;
    }
    x.putImageData(im,0,0);heroCache[color]=c.toDataURL('image/jpeg',.85);if(el.isConnected)el.src=heroCache[color];
  };
  if(heroImg&&heroImg.complete)run();else{heroImg=new Image();heroImg.onload=run;heroImg.src=RACE_IMG}
}
render.play=()=>{
  const SEC=15;
  let nCars=2,nLights=3,soloMin=2,names=CARS.map((_,i)=>''),STEPS,lights,pos,lstate,turn,t,tl,q,over,gt,gleft;
  const nm=i=>names[i].trim()||`المتسابق ${ar(i+1)}`;
  const solo=()=>nCars===1;
  $('#main').innerHTML=`<section class="stage">
   <div class="stage-head"><span class="ribbon">ألعب</span><h2>سباق السيارات</h2>
   <p class="goal">كل إجابة صحيحة تقدّم السيارة خطوة. الإجابة الخاطئة توقف السيارة عند آخر إشارة مرور وصلت إليها وتصبح الإشارة حمراء. أول سيارة تصل خط النهاية تفوز، واللاعب الوحيد يسابق الوقت.</p></div>
   <div class="panel" id="gp"></div>${footer()}</section>`;

  const saveNames=()=>document.querySelectorAll('#gp .racer input').forEach((inp,i)=>names[i]=inp.value);
  const setup=()=>{
    clearInterval(t);clearInterval(gt);
    $('#gp').innerHTML=`<div class="setup"><img class="hero-car" id="hero" src="${heroCache[CARS[0].c]||RACE_IMG}" alt="سيارة سباق">
      <div><b>عدد المتسابقين</b><div class="chips" id="cc">${[1,2,3,4].map(n=>`<button class="chip ${n===nCars?'on':''}" data-n="${n}">${ar(n)}</button>`).join('')}</div></div>
      <div><b>أسماء المتسابقين</b><div class="racers">${CARS.slice(0,nCars).map((k,i)=>`<div class="racer" style="--car:${k.c}"><div class="racer-top"><span class="pc">${carSvg(k.c,k.k)}</span>
          <input id="racer${i}" type="text" maxlength="20" aria-label="اسم المتسابق ${ar(i+1)}" placeholder="المتسابق ${ar(i+1)}" value="${names[i].replace(/"/g,'&quot;')}"></div>
          <div class="swatches" aria-label="لون السيارة">${PALETTE.map(c=>`<button class="sw ${c===k.c?'on':''}" style="background:${c}" data-i="${i}" data-c="${c}" aria-label="لون"></button>`).join('')}</div></div>`).join('')}</div></div>
      ${solo()?`<div><b>⏱️ الوقت المحدد للسباق</b><div class="chips" id="sc">${[1,2,3,4].map(n=>`<button class="chip ${n===soloMin?'on':''}" data-n="${n}">${ar(n)} د</button>`).join('')}</div></div>`:''}
      <div><b>عدد إشارات المرور</b><div class="chips" id="lc">${[1,2,3,4,5].map(n=>`<button class="chip ${n===nLights?'on':''}" data-n="${n}">${ar(n)}</button>`).join('')}</div>
        <div class="preview">${'<span class="tl amber"><i></i><i></i><i></i></span>'.repeat(nLights)}</div></div>
      <div class="btns"><button class="btn sun" id="go" style="font-size:22px;padding:12px 34px">انطلق 🏁</button></div></div>`;
    $('#cc').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{saveNames();nCars=+b.dataset.n;setup()});
    $('#lc').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{saveNames();nLights=+b.dataset.n;setup()});
    if(solo())$('#sc').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{saveNames();soloMin=+b.dataset.n;setup()});
    $('#go').onclick=()=>{saveNames();start()};
    setHero($('#hero'),CARS[0].c);
    document.querySelectorAll('#gp .sw').forEach(b=>b.onclick=()=>{saveNames();const i=+b.dataset.i,c=b.dataset.c,j=CARS.findIndex(x=>x.c===c);
      if(j>=0&&j!==i)CARS[j].c=CARS[i].c; CARS[i].c=c; setup()});
  };

  const start=()=>{
    clearInterval(t);clearInterval(gt);
    STEPS=(nLights+1)*3; lights=Array.from({length:nLights},(_,i)=>(i+1)*3);
    pos=Array(nCars).fill(0); lstate=Array.from({length:nCars},()=>lights.map(()=>'amber')); turn=0; over=false;
    $('#gp').innerHTML=`${solo()?`<div class="gclock"><span>⏱️ الوقت المتبقي</span><b id="gclk"></b></div>`:''}
      <div class="track" id="trk"></div><div class="qbox" id="qb"></div>`;
    drawTrack();
    if(solo()){gleft=soloMin*60;showG();
      gt=setInterval(()=>{if(!$('#gclk')){clearInterval(gt);return}gleft--;showG();if(gleft<=0){clearInterval(gt);timeUp()}},1000);}
    ask();
  };
  const showG=()=>{const m=Math.floor(gleft/60),s=gleft%60;const el=$('#gclk');el.textContent=ar(m)+':'+ar(String(s).padStart(2,'0'));el.parentElement.classList.toggle('low',gleft<=20)};

  const drawTrack=()=>{
    $('#trk').innerHTML=pos.map((p,i)=>`<div class="lane-wrap ${i===turn&&!over&&!solo()?'turn':''}">
      <div class="lane-name" style="color:${CARS[i].c}">🏎️ ${nm(i)} <small>${ar(p)} / ${ar(STEPS)}</small></div>
      <div class="road">
        ${lights.map((L,k)=>`<span class="tl ${lstate[i][k]}" style="right:calc((100% - 90px) * ${L/STEPS} + 86px)"><i></i><i></i><i></i></span>`).join('')}
        <span class="car" id="car${i}" style="right:0">${carSvg(CARS[i].c,CARS[i].k)}</span>
      </div></div>`).join('');
    pos.forEach((p,i)=>moveCar(i));
  };
  const moveCar=i=>{const el=$('#car'+i);if(el)el.style.right=`calc((100% - 90px) * ${pos[i]/STEPS})`};

  const ask=()=>{
    if(over)return;
    let a=1+Math.floor(Math.random()*8),b=1+Math.floor(Math.random()*(9-a));
    q={x:a*10,y:b*10,ans:(a+b)*10};tl=SEC;
    $('#qb').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;font-weight:800;gap:8px">
        <span class="whose" style="background:${CARS[turn].c}">${solo()?nm(0):'دور '+nm(turn)}</span>${solo()?'':`<span id="tsec">${ar(SEC)} ث</span>`}</div>
      ${solo()?'':'<div class="tbar"><i id="tbar" style="width:100%"></i></div>'}
      <div class="eq gq">${ar(q.x)} + ${ar(q.y)} = ؟</div>
      <div class="opts">${options(q.ans).map(o=>`<button class="opt" data-v="${o}">${ar(o)}</button>`).join('')}</div>
      <div class="msg" id="gm"></div>`;
    document.querySelectorAll('#qb .opt').forEach(b=>b.onclick=()=>answer(b));
    clearInterval(t);
    if(!solo())t=setInterval(()=>{tl-=.2;const el=$('#tbar');if(!el){clearInterval(t);return}
      el.style.width=Math.max(0,tl/SEC*100)+'%';$('#tsec').textContent=ar(Math.max(0,Math.ceil(tl)))+' ث';if(tl<=0)answer(null)},200);
  };

  const answer=b=>{
    if(over)return;
    clearInterval(t);document.querySelectorAll('#qb .opt').forEach(o=>{o.disabled=true;if(+o.dataset.v===q.ans)o.classList.add('ok')});
    const ok=b&&+b.dataset.v===q.ans,i=turn;
    if(b&&!ok)b.classList.add('no');
    const gm=$('#gm');
    if(ok){
      lights.forEach((L,k)=>{if(L===pos[i])lstate[i][k]='green'});
      pos[i]=Math.min(STEPS,pos[i]+1);
      lights.forEach((L,k)=>{if(L<pos[i])lstate[i][k]='green'});
      gm.className='msg ok';gm.textContent=`إجابة صحيحة يا ${nm(i)}! تقدّمت السيارة 🏎️💨`;
    }else{
      const back=Math.max(0,...lights.filter(L=>L<=pos[i]));
      pos[i]=back;
      const k=lights.indexOf(back);if(k>=0)lstate[i][k]='red';
      gm.className='msg no';
      gm.textContent=(b?`الإجابة ${ar(q.ans)}. `:'انتهى الوقت! ')+(k>=0?'🚦 قف! توقفت السيارة عند الإشارة الحمراء':'🚦 قف! توقفت السيارة عند خط البداية');
      const car=$('#car'+i);car&&car.classList.add('stop');setTimeout(()=>car&&car.classList.remove('stop'),600);
    }
    beep(ok);
    if(pos[i]>=STEPS){over=true;clearInterval(gt);refresh();setTimeout(()=>end(i),900);return}
    if(!solo())turn=(turn+1)%nCars;
    setTimeout(()=>{if(over)return;refresh();ask()},solo()?1300:2000);
    refresh(false);
  };
  // update lights/labels without re-creating cars (keeps the drive animation)
  const refresh=(withTurn=true)=>{
    document.querySelectorAll('#trk .lane-wrap').forEach((w,i)=>{
      if(withTurn)w.classList.toggle('turn',i===turn&&!over&&!solo());
      w.querySelector('small').textContent=`${ar(pos[i])} / ${ar(STEPS)}`;
      w.querySelectorAll('.tl').forEach((l,k)=>l.className='tl '+lstate[i][k]);
      moveCar(i);
    });
  };

  const timeUp=()=>{
    over=true;clearInterval(t);refresh();
    $('#qb').innerHTML=`<div class="win" style="color:var(--bad)">⏱️ انتهى الوقت!</div>
      <div class="eq small-eq">وصل ${nm(0)} إلى الخطوة ${ar(pos[0])} من ${ar(STEPS)}</div>
      <div class="btns"><button class="btn sun" id="again">حاول مرة أخرى</button><button class="btn alt" id="set">غيّر الإعدادات</button></div>`;
    $('#again').onclick=start;$('#set').onclick=setup;beep(false);
  };
  const end=w=>{
    const used=solo()?soloMin*60-gleft:0;
    $('#qb').innerHTML=`<img class="hero-car" id="heroW" src="${heroCache[CARS[w].c]||RACE_IMG}" alt=""><div class="win" style="color:${CARS[w].c}">🏆 ${solo()?'أحسنت يا '+nm(w)+'! وصلت قبل انتهاء الوقت':'فاز '+nm(w)+'!'}</div>
      ${solo()?`<div class="eq small-eq">زمنك: ${ar(Math.floor(used/60))}:${ar(String(used%60).padStart(2,'0'))}</div>`:''}
      <div class="btns"><button class="btn sun" id="again">سباق جديد</button><button class="btn alt" id="set">غيّر المتسابقين والإشارات</button></div>`;
    $('#again').onclick=start;$('#set').onclick=setup;setHero($('#heroW'),CARS[w].c);confetti();
  };
  setup();
};

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#009688','#ffc93c','#f07a2a','#3aa0e8','#1f9d55'];
  const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*3,r:Math.random()*6,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*5)]}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((p.y+p.r)/30);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s*.6)});if(++f<200)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})();
}

nav();resetClock();render.ready();
</script>

</body></html>
