/* تخطيط: عمود واحد بعرض الجوال — شاشة بداية، سؤال كبير مع مؤقت، ثم النتيجة */
:root{
  --bg:#eaf4f2;--card:#fff;--fg:#0f2e2a;--muted:#55716c;--line:#c9dedb;
  --teal:#009688;--teal-d:#00695f;--teal-soft:#d3ece8;--on-teal:#fff;
  --ok:#1f8f4e;--bad:#c4392f;--warn:#e08a00;--gold:#c98a00;
  --f:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1c1a;--card:#132826;--fg:#e4f2ef;--muted:#93b2ac;--line:#24403c;--teal:#2bb5a6;--teal-d:#7fd8cd;--teal-soft:#183c38;--on-teal:#04201c;--ok:#43c27a;--bad:#ff7a6e;--warn:#ffb340;--gold:#ffc94d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1c1a;--card:#132826;--fg:#e4f2ef;--muted:#93b2ac;--line:#24403c;--teal:#2bb5a6;--teal-d:#7fd8cd;--teal-soft:#183c38;--on-teal:#04201c;--ok:#43c27a;--bad:#ff7a6e;--warn:#ffb340;--gold:#ffc94d;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg);font-family:var(--f);direction:rtl;margin:0}
body{padding-inline:16px;padding-block:14px 28px;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
button{font-family:var(--f);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 16px;display:grid;gap:12px;text-align:center}
h1{margin:0;font-size:1.9rem;font-weight:900;color:var(--teal-d);text-wrap:balance}
.sub{margin:0;color:var(--muted);font-weight:700}
.big{font-size:1.45rem;font-weight:900;padding:18px;border-radius:16px;border:0;background:var(--teal);color:var(--on-teal)}
.big.alt{background:var(--card);color:var(--teal-d);border:2.5px solid var(--teal)}
.link{background:none;border:0;color:var(--muted);font-weight:800;font-size:1rem;padding:6px}
.best{font-weight:800;color:var(--gold)}
input[type=text]{font-family:var(--f);font-size:1.15rem;font-weight:700;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--fg);text-align:center}
label{font-weight:800;text-align:right}
/* السؤال */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{font-size:1.3rem;font-weight:900;text-align:right;min-width:0}
.who small{display:block;color:var(--muted);font-size:.85rem;font-weight:700}
.timer{position:relative;width:82px;aspect-ratio:1;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .trk{fill:none;stroke:var(--teal-soft);stroke-width:10}
.timer .arc{fill:none;stroke:var(--teal);stroke-width:10;stroke-linecap:round}
.timer.warn .arc{stroke:var(--warn)}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:1.6rem}
.dots{display:flex;gap:6px;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.now{background:var(--teal)}
.tag{justify-self:center;background:var(--teal-soft);color:var(--teal-d);font-weight:800;border-radius:999px;padding:4px 14px}
.qtext{margin:0;font-size:1.35rem;font-weight:800;line-height:1.6;text-wrap:balance}
.qtext em{font-style:normal;color:var(--teal-d);font-size:1.3em}
.expr{display:flex;justify-content:center;align-items:center;gap:12px;font-size:clamp(3rem,15vw,4.6rem);font-weight:900;line-height:1.1}
.expr.ltr{direction:ltr}
.slot{display:inline-grid;place-items:center;min-width:1.3em;height:1.1em;border:4px dashed var(--teal);border-radius:14px;color:var(--teal-d)}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.ch{font-size:2.4rem;font-weight:900;padding:12px 4px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--fg)}
.choices.c3 .ch{direction:ltr}
.ch.ok{background:var(--ok);border-color:var(--ok);color:var(--card)}
.ch.bad{background:var(--bad);border-color:var(--bad);color:var(--card)}
.sym{direction:ltr;unicode-bidi:isolate;display:inline-block}
/* النتيجة */
.score{font-size:4.6rem;font-weight:900;line-height:1;color:var(--teal-d)}
.score small{font-size:.4em;color:var(--muted)}
.stars{font-size:2rem;color:var(--gold);letter-spacing:4px}
.msg{font-size:1.35rem;font-weight:900}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{border:2px solid var(--line);border-radius:14px;padding:12px 6px;display:grid;gap:4px}
.pl.win{border-color:var(--gold);background:var(--teal-soft)}
.pl b{font-size:1.15rem}
.pl .n{font-size:2.4rem;font-weight:900;color:var(--teal-d);line-height:1}
.pl small{color:var(--muted);font-weight:700}
.crown{font-size:1.6rem}
</style>

<div class="wrap">
  <!-- البداية -->
  <section class="card" id="vHome">
    <h1>تحدي الرياضيات المنزلي</h1>
    <p class="sub">الصف الثاني الابتدائي · ٥ أسئلة في دقيقة واحدة</p>

  </section>

  <!-- السؤال -->
  <section class="card" id="vQ" hidden>
    <div class="top">

      <div class="timer" id="timer"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="42"></circle><circle class="arc" id="arc" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="0"></circle></svg><div class="t" id="tNum">٦٠</div></div>

    <div class="dots" id="dots"></div>
    <span class="tag" id="tag"></span>
    <div id="qBody" style="display:grid;gap:10px"></div>
    <div class="choices" id="choices"></div>
  </section>

  <!-- النتيجة -->
  <section class="card" id="vEnd" hidden>
    <div id="endBody" style="display:grid;gap:10px"></div>
    <button class="big" id="again" type="button">العب مرة أخرى</button>
    <button class="link" type="button" data-home>القائمة الرئيسية</button>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const AD=s=>String(s).replace(/[0-9]/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const TOTAL=60, CIRC=263.9;

/* الأسئلة: جمع، جمع، طرح، آحاد وعشرات، مقارنة */
function opts(ans,c,lo=0){const s=new Set([ans]);for(const x of shuffle(c))if(s.size<4&&x>=lo&&x!==ans)s.add(x);let k=1;while(s.size<4){for(const x of[ans+k,ans-k])if(s.size<4&&x>=lo)s.add(x);k++}return shuffle([...s]).map(v=>({v,l:AD(v)}))}
function makeQs(){
  const q=[],used=new Set();
  for(let i=0;i<2;i++){let a,b;do{const s=ri(5,10);a=ri(1,s-1);b=s-a}while(used.has(a+"+"+b));used.add(a+"+"+b);
    q.push({t:"add",tag:"الجمع",p:"أوجد ناتج الجمع",a,b,ans:a+b,ch:opts(a+b,[a+b+1,a+b-1,a+b+2,a+b-2],1)})}
  {const a=ri(5,10),b=ri(1,a-1);q.push({t:"sub",tag:"الطرح",p:"أوجد ناتج الطرح",a,b,ans:a-b,ch:opts(a-b,[a-b+1,a-b-1,a+b,a-b+2],0)})}
  {let t,o;do{t=ri(1,9);o=ri(1,9)}while(t===o);const n=t*10+o,k=ri(0,2);
    if(k===0)q.push({t:"pv",tag:"الآحاد والعشرات",p:`كم عدد <em>العشرات</em> في العدد <em>${AD(n)}</em> ؟`,ans:t,ch:opts(t,[o,t+1,t-1],1)});
    else if(k===1)q.push({t:"pv",tag:"الآحاد والعشرات",p:`كم عدد <em>الآحاد</em> في العدد <em>${AD(n)}</em> ؟`,ans:o,ch:opts(o,[t,o+1,o-1],0)});
    else q.push({t:"pv",tag:"الآحاد والعشرات",p:`ما العدد الذي فيه <em>${AD(t)}</em> عشرات و <em>${AD(o)}</em>&nbsp;آحاد&nbsp;؟`,ans:n,ch:opts(n,[o*10+t,n+10,n-10],10)})}
  {const k=ri(0,2);let a=ri(2,20),b;if(k===2)b=a;else do{b=ri(1,20)}while(b===a);
    q.push({t:"cmp",tag:"أكبر من وأصغر من ويساوي",p:"اختر العلامة المناسبة",a,b,ans:a>b?"<":a<b?">":"=",ch:shuffle([">","<","="]).map(v=>({v,l:`<span class="sym">&lrm;${v==="<"?"&lt;":v===">"?"&gt;":"="}&lrm;</span>`}))})}
  return q;
}

/* أصوات قصيرة */
let ac=null;
function beep(f,d,v=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);const t=ac.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}

/* الحالة */
let mode="solo",players=[],pi=0,qs=[],qi=0,res=[],left=TOTAL,timerId=null,last=0,lock=false;
function show(v){["vHome","vNames","vTurn","vQ","vEnd"].forEach(x=>$(x).hidden=x!==v);window.scrollTo(0,0)}
function home(){stop();const b=store.get("hc_best",null);$("bestTxt").textContent=b?`أفضل نتيجة لك: ${AD(b.s)} من ${AD(5)} في ${AD(b.t)} ثانية`:"";show("vHome")}

function turn(){
  const p=players[pi];
  $("turnSub").textContent=mode==="duo"?`الدور ${AD(pi+1)} من ${AD(2)}`:"تحدَّ نفسك";
  $("turnName").textContent=mode==="duo"?`دور ${p.name}`:"هل أنت مستعد؟";
  show("vTurn");
}
function play(){
  qs=makeQs();qi=0;res=[];left=TOTAL;
  $("qWho").textContent=mode==="duo"?players[pi].name:"";
  show("vQ");draw();start();
}
function draw(){
  const q=qs[qi];lock=false;
  $("qNo").textContent=`السؤال ${AD(qi+1)} من ${AD(5)}`;
  $("dots").innerHTML=qs.map((_,i)=>`<span class="dot ${res[i]===undefined?(i===qi?"now":""):(res[i]?"ok":"bad")}"></span>`).join("");
  $("tag").textContent=q.tag;
  let b;
  if(q.t==="add"||q.t==="sub")b=`<p class="qtext">${q.p}</p><div class="expr"><span>${AD(q.a)}</span><span>${q.t==="add"?"+":"−"}</span><span>${AD(q.b)}</span><span>=</span><span class="slot" id="slot">&nbsp;</span></div>`;
  else if(q.t==="pv")b=`<p class="qtext">${q.p}</p>`;
  else b=`<p class="qtext">${q.p}</p><div class="expr ltr"><span>${AD(q.b)}</span><span class="slot" id="slot">&nbsp;</span><span>${AD(q.a)}</span></div>`;
  $("qBody").innerHTML=b;
  $("choices").className="choices"+(q.ch.length===3?" c3":"");
  $("choices").innerHTML=q.ch.map((c,i)=>`<button class="ch" type="button" data-i="${i}">${c.l}</button>`).join("");
  $("choices").querySelectorAll(".ch").forEach(x=>x.onclick=()=>pick(+x.dataset.i));
}
function pick(i){
  if(lock)return;lock=true;
  const q=qs[qi],ok=q.ch[i].v===q.ans,ci=q.ch.findIndex(c=>c.v===q.ans);
  const bs=[...$("choices").children];bs[ci].classList.add("ok");if(!ok)bs[i].classList.add("bad");
  const s=$("slot");if(s)s.innerHTML=q.ch[ci].l;
  ok?beep(880,.15):beep(220,.25);
  res[qi]=ok;stop();
  setTimeout(()=>{qi++;if(qi>=5)finish();else{draw();start()}},ok?500:1000);
}
function start(){stop();last=performance.now();timerId=setInterval(tick,100);paint()}
function stop(){clearInterval(timerId);timerId=null}
function tick(){
  const now=performance.now();left=Math.max(0,left-(now-last)/1000);last=now;paint();
  if(left<=0){stop();beep(300,.5);for(let k=qi;k<5;k++)if(res[k]===undefined)res[k]=false;lock=true;setTimeout(finish,600)}
}
function paint(){$("tNum").textContent=AD(Math.ceil(left));$("arc").setAttribute("stroke-dashoffset",(CIRC*(1-left/TOTAL)).toFixed(1));$("timer").className="timer"+(left<=10?" warn":"")}
function finish(){
  stop();const s=res.filter(Boolean).length,t=Math.round(TOTAL-left);
  players[pi].s=s;players[pi].t=t;
  if(mode==="duo"&&pi===0){pi=1;turn();return}
  let h;
  if(mode==="solo"){
    const b=store.get("hc_best",null),rec=!b||s>b.s||(s===b.s&&t<b.t);
    if(rec)store.set("hc_best",{s,t});
    h=`<div class="stars">${"★".repeat(s)}${"☆".repeat(5-s)}</div><div class="score">${AD(s)}<small> / ${AD(5)}</small></div>
       <div class="sub">الوقت: ${AD(t)} ثانية</div>
       <div class="msg">${rec?"رقم قياسي جديد! 🎉":s===5?"ممتاز!":s>=3?"أحسنت، حاول أن تكون أسرع":"تدرّب أكثر وستتحسن"}</div>
       ${!rec&&b?`<div class="best">أفضل نتيجة لك: ${AD(b.s)} من ${AD(5)} في ${AD(b.t)} ثانية</div>`:""}`;
  }else{
    const [a,b]=players,w=a.s!==b.s?(a.s>b.s?0:1):a.t!==b.t?(a.t<b.t?0:1):-1;
    h=`<div class="msg">${w<0?"تعادل! 🤝":`الفائز: ${esc(players[w].name)} 🏆`}</div>
       <div class="vs">${players.map((p,i)=>`<div class="pl ${i===w?"win":""}">${i===w?'<span class="crown">👑</span>':""}<b>${esc(p.name)}</b><span class="n">${AD(p.s)}<small> / ${AD(5)}</small></span><small>${AD(p.t)} ثانية</small></div>`).join("")}</div>
       ${w>=0&&a.s===b.s?`<div class="sub">نفس الدرجة، والفوز للأسرع</div>`:""}`;
  }
  $("endBody").innerHTML=h;show("vEnd");
}

$("goSolo").onclick=()=>{mode="solo";players=[{name:""}];pi=0;turn()};
$("goDuo").onclick=()=>show("vNames");
$("startDuo").onclick=()=>{mode="duo";players=[{name:$("p1").value.trim()||"اللاعب الأول"},{name:$("p2").value.trim()||"اللاعب الثاني"}];pi=0;turn()};
$("go").onclick=()=>{beep(660,.1);play()};
$("again").onclick=()=>{pi=0;turn()};
document.querySelectorAll("[data-home]").forEach(b=>b.onclick=home);
home();
</script>

</body>
</html>
