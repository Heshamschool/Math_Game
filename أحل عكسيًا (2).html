<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>أحل عكسيًا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout: one problem per screen, textbook order. Big touchable text beside its picture, then أخطط / أحل / أتحقق open under it. */
:root{
  --ground:#f3f8ef; --paper:#ffffff; --ink:#1b2a22; --muted:#55685c; --line:#c9dcc0;
  --green:#3f9a3c; --green-soft:#8cc276; --green-pale:#e4f2db;
  --blue:#1f4fa8; --blue-pale:#e4ecfa;
  --red:#d3362b; --red-pale:#fdeae7;
  --sun:#f6b73c;
  --display:"Baloo Bhaijaan 2","Noto Naskh Arabic",Tahoma,sans-serif;
  --text:"Noto Naskh Arabic","Traditional Arabic","Geeza Pro",serif;
  --t:clamp(1.85rem,4.7vw,3.1rem);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--text);font-size:1.1rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:relative;overflow:hidden;background:linear-gradient(var(--green-soft),var(--green-pale))}
header svg{position:absolute;inset:auto 0 0;width:100%;height:30px;display:block}
.head{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-block:12px 34px}
.pill{font-family:var(--display);font-weight:800;font-size:1.5rem;color:#fff;background:var(--blue);padding:2px 22px;border-radius:99px;box-shadow:0 3px 0 #123779}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.25;color:#17591a}
.head small{font-family:var(--display);font-weight:600;font-size:clamp(1.3rem,3vw,1.8rem);color:var(--blue)}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--line)}
.tabs{display:flex;gap:6px;padding-block:8px}
.tab{flex:1 1 0;min-width:0;min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--paper);font-family:var(--display);font-weight:600;font-size:clamp(.9rem,2.4vw,1.1rem);line-height:1.1;padding:4px 2px}
.tab b{display:block;font-weight:800;font-size:1.5rem}
.fs{flex:none;width:60px;min-height:56px;display:grid;place-items:center;border:2px solid var(--blue);border-radius:14px;background:var(--blue-pale);color:var(--blue);padding:0}
.fs svg{width:30px;height:30px}
.tab[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

main{padding-block:16px 40px;display:grid;gap:16px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:clamp(14px,2.4vw,28px)}
.word{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.4vw,2.8rem);line-height:1.2}
.word.b{color:var(--blue)} .word.g{color:var(--green)}

.kicker{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.kicker span{font-family:var(--display);font-weight:600;color:var(--muted);font-size:1.1rem}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:8px;margin-block:8px 14px}
.lg{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:14px;font-weight:700;font-size:clamp(1.15rem,2.4vw,1.45rem);line-height:1.5}
.lg.g{background:var(--blue-pale);color:var(--blue)} .lg.r{background:var(--red-pale);color:var(--red)}
.lg svg{flex:none;width:46px;height:30px}
.lg em{margin-inline-start:auto;font-style:normal;font-family:var(--display);font-weight:800;white-space:nowrap}

.prob{display:grid;gap:16px;align-items:center}
.pic{justify-self:center;max-width:100%;max-height:38vh;border-radius:16px}
.pic{grid-row:1}.ptext{grid-row:2}
@media (min-width:1000px){
  .prob{grid-template-columns:minmax(0,1fr) 44%}
  .pic{width:100%;max-height:none;grid-column:2;grid-row:1}
  .ptext{grid-column:1;grid-row:1}
}
.ptext{position:relative;min-width:0;font-size:var(--t);line-height:2.15;font-weight:700}
.ptext svg.ink{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ch{cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent;transition:color .15s}
@media (hover:hover){.ch:hover{background:var(--green-pale)}}
.ch.r{display:inline-block;padding-inline:.3em;line-height:1.75}
.ch.on.g{color:var(--blue)} .ch.on.r{color:var(--red)}
.ch.no{animation:no .4s}
@keyframes no{30%{background:#fde3c4}}
.ink path{fill:none;stroke-linecap:round;stroke-linejoin:round}

.say{min-height:2.2em;margin:12px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(1.2rem,2.6vw,1.5rem);text-align:center;color:var(--muted)}
.say.ok{color:#23752a}.say.bad{color:#b4530f}

.stage{padding:0;overflow:hidden}
.st-h{display:flex;width:100%;align-items:center;gap:14px;min-height:76px;padding:6px clamp(14px,2.4vw,28px);background:none;border:0;text-align:start}
.st-h small{font-family:var(--text);font-weight:700;font-size:clamp(1.15rem,2.5vw,1.5rem);color:var(--ink)}
.st-h i{margin-inline-start:auto;font-style:normal;width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--green-pale);color:var(--green);transition:transform .2s}
.st-h[aria-expanded="true"] i{transform:rotate(180deg)}
.st-h:disabled{cursor:default;opacity:.55}
.st-b{padding:0 clamp(14px,2.4vw,28px) clamp(14px,2.4vw,26px)}
.big{margin:0;font-size:clamp(1.55rem,3.6vw,2.3rem);line-height:1.9;font-weight:700}

.lab{font-family:var(--display);font-weight:600;font-size:clamp(1.05rem,2.2vw,1.3rem);color:var(--muted);margin:10px 0 4px}
.lab.up{color:var(--blue)}
.track{display:grid;gap:clamp(3px,.8vw,8px);align-items:center}
.node{aspect-ratio:1.15;max-height:130px;width:100%;display:grid;place-items:center;border-radius:clamp(10px,1.6vw,18px);font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,6.2vw,4rem);line-height:1;border:3px solid var(--line);background:var(--paper);min-width:0}
.node.q{border-color:var(--sun);background:#fff6df;color:#a26a00}
.node.known{border-color:var(--green);background:var(--green-pale);color:#17591a}
.node.hole{border-style:dashed;color:transparent}
.node.ans{border-color:var(--red);background:var(--red-pale);color:var(--red)}
.op{display:grid;justify-items:center;gap:0;font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,4.4vw,3rem);line-height:1.1;min-width:0}
.op svg{width:min(100%,84px);height:18px}
.op.dn{color:#a93a16}.op.up{color:var(--blue)}
.op.wait{visibility:hidden}
.sg{display:flex;gap:.08em}
.pop{animation:pop .35s cubic-bezier(.2,1.5,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:.2}}

.eqs{display:grid;gap:4px;margin-top:14px}
.eq{display:flex;justify-content:center;gap:.28em;font-family:var(--display);font-weight:800;font-size:clamp(2rem,5.6vw,3.6rem);line-height:1.35}
.eq .o{color:var(--blue)} .eq .a{color:var(--red)}
.act{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
.btn{min-height:60px;padding:6px 30px;border-radius:16px;border:0;background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,2.8vw,1.7rem);box-shadow:0 4px 0 #123779}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #123779}
.btn.ghost{background:var(--paper);color:var(--muted);border:2px solid var(--line);box-shadow:none}
.res{text-align:center;margin:14px 0 0;font-size:clamp(1.6rem,3.8vw,2.5rem);font-weight:700;line-height:1.8}
.res b{display:inline-block;min-width:2.2em;font-family:var(--display);font-weight:800;color:var(--red);border-bottom:3px dotted var(--muted);line-height:1.2}
.res.fine{color:#23752a}
.res.fine svg{width:1em;height:1em;vertical-align:-.12em;margin-inline-end:.2em}
.home{margin:0;padding:12px 16px;border-radius:14px;background:var(--green-pale);font-size:clamp(1.15rem,2.4vw,1.4rem);line-height:1.8;font-weight:500}
.home strong{font-family:var(--display);color:#23752a}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

      <div class="lg r"><svg viewBox="0 0 46 30" aria-hidden="true"><ellipse cx="23" cy="15" rx="20" ry="11" fill="none" stroke="currentColor" stroke-width="4.5"/></svg>مَا الْمَطْلُوبُ فِي الْمَسْأَلَةِ؟ أُحَوِّطُهُ.<em id="cr"></em></div>
    </div>
    <div class="prob"><div class="ptext" id="pt"></div><img class="pic" src="${IMG[p.img]}" alt="${p.alt}"></div>
    <p class="say" id="say" aria-live="polite"></p>
  </section>`);
  app.append(card);
  const pt=card.querySelector("#pt");
  p.parts.forEach(([k,txt],i)=>{
    const c=$(`<span class="ch ${k}${s.marks.has(i)?" on":""}" role="button" tabindex="0" data-i="${i}" data-k="${k}"></span>`);c.textContent=txt;
    const act=()=>tap(c,i,k);c.onclick=act;c.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();act()}};
    pt.append(c);
  });
  pt.insertAdjacentHTML("beforeend",'<svg class="ink" aria-hidden="true"></svg>');
  updateCounts();drawInk();

  app.append(stage("plan","أُخَطِّطُ","g","كَيْفَ سَأَحُلُّ الْمَسْأَلَةَ؟",b=>{
    b.innerHTML=`<p class="big"><strong style="color:var(--green)">أَحُلُّ بِاتِّجَاهٍ عَكْسِيٍّ:</strong> ${p.plan}</p>`;
  }));
  app.append(stage("solve","أَحُلُّ","b","أَبْدَأُ مِنَ النِّهَايَةِ وَأَرْجِعُ إِلَى الْبِدَايَةِ.",b=>solveBody(b)));
  app.append(stage("check","أَتَحَقَّقُ","g","هَلْ إِجَابَتِي مَعْقُولَةٌ؟",b=>checkBody(b),()=>s.steps<p.subs.length));
  if(p.home)app.append($(`<p class="home"><strong>نَشَاطٌ مَنْزِلِيٌّ: </strong>${p.home}</p>`));
  const foot=$(`<div class="foot"></div>`);
  const r=$(`<button class="btn ghost">أبدأ من جديد</button>`);r.onclick=()=>{S[cur]={marks:new Set(),open:{},steps:0,checked:false};render()};foot.append(r);
  if(cur<P.length-1){const n=$(`<button class="btn">المسألة التالية</button>`);n.onclick=()=>go(cur+1);foot.append(n)}
  app.append(foot);
}
function updateCounts(){
  const p=P[cur],s=S[cur];
  const n=t=>p.parts.filter(x=>x[0]==t).length, c=t=>p.parts.reduce((a,x,i)=>a+(x[0]==t&&s.marks.has(i)?1:0),0);
  document.getElementById("cg").textContent=`${ar(c("g"))} من ${ar(n("g"))}`;
  document.getElementById("cr").textContent=`${ar(c("r"))} من ${ar(n("r"))}`;
}
function say(t,cl){const e=document.getElementById("say");e.textContent=t;e.className="say "+(cl||"")}
function tap(el,i,k){
  const p=P[cur],s=S[cur];
  if(k=="p"){el.classList.remove("no");void el.offsetWidth;el.classList.add("no");setTimeout(()=>el.classList.remove("no"),420);say("هذا الجزء ليس من المعطيات ولا المطلوب، جرّب غيره.","bad");return}
  if(s.marks.has(i)){s.marks.delete(i);el.classList.remove("on");say("");drawInk();updateCounts();return}
  s.marks.add(i);el.classList.add("on");drawInk(i);updateCounts();
  const total=p.parts.filter(x=>x[0]!="p").length;
  if(s.marks.size==total)say("أحسنت! حدّدت المعطيات والمطلوب، ننتقل إلى أخطّط.","ok");
  else say(k=="g"?"صحيح، هذا من المعطيات.":"صحيح، هذا هو المطلوب.","ok");
}
/* hand-drawn marks: positions come from the laid-out text so they follow wrapping */
function rnd(seed){let x=seed*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280-.5}}
function under(r,y,seed){
  const R=rnd(seed),a=r.right+2,b=r.left-2,steps=Math.max(2,Math.round((a-b)/70));let d=`M${a} ${y+R()*3}`;
  for(let i=1;i<=steps;i++){const X=a-(a-b)*i/steps,Xm=a-(a-b)*(i-.5)/steps;d+=` Q${Xm} ${y+R()*7} ${X} ${y+R()*4}`}
  return d;
}
function loop(x,y,w,h,seed){
  const R=rnd(seed),j=s=>R()*s,r=Math.min(h/2,48);
  const Q=(a,b,c,e)=>`Q${(a+c)/2+j(4)} ${(b+e)/2+j(5)} ${c} ${e}`;
  return `M${x+w-r} ${y+j(3)} ${Q(x+w-r,y,x+r,y+j(3))} Q${x} ${y} ${x+j(3)} ${y+r} ${Q(x,y+r,x+j(3),y+h-r)} Q${x} ${y+h} ${x+r} ${y+h+j(3)} ${Q(x+r,y+h,x+w-r,y+h+j(3))} Q${x+w} ${y+h} ${x+w+j(3)} ${y+h-r} ${Q(x+w,y+h-r,x+w+j(3),y+r)} Q${x+w} ${y} ${x+w-r} ${y-2} L${x+w-r-Math.min(34,w/5)} ${y+3}`;
}
function drawInk(newI){
  const pt=document.getElementById("pt");if(!pt)return;
  const svg=pt.querySelector("svg.ink"),o=pt.getBoundingClientRect(),fs=parseFloat(getComputedStyle(pt).fontSize);
  svg.innerHTML="";const NS="http://www.w3.org/2000/svg";
  const anim=!matchMedia("(prefers-reduced-motion:reduce)").matches;
  pt.querySelectorAll(".ch.on").forEach(c=>{
    const i=+c.dataset.i,k=c.dataset.k,ps=[];
    if(k=="g"){
      [...c.getClientRects()].filter(r=>r.width>4).forEach((r,n)=>{
        const rr={left:r.left-o.left,right:r.right-o.left};
        ps.push(under(rr,r.bottom-o.top-fs*.02,i*7+n+1));
      });
    }else{
      const r=c.getBoundingClientRect();
      ps.push(loop(r.left-o.left-2,r.top-o.top+fs*.08,r.width+4,r.height-fs*.06,i+3));
    }
    ps.forEach((d,n)=>{
      const e=document.createElementNS(NS,"path");e.setAttribute("d",d);
      e.setAttribute("stroke",k=="g"?"#1f4fa8":"#d3362b");e.setAttribute("stroke-width",Math.max(3.5,fs*(k=="g"?.1:.085)));
      svg.append(e);
      if(anim&&i===newI){const L=e.getTotalLength();e.style.strokeDasharray=L;e.style.strokeDashoffset=L;
        e.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:k=="g"?420:750,delay:n*260,easing:"ease-in-out",fill:"forwards"}).onfinish=()=>{e.style.strokeDasharray="";e.style.strokeDashoffset=""}}
    });
  });
}
function stage(key,word,col,hint,fill,dis){
  const s=S[cur],sec=$(`<section class="card stage"></section>`);
  const off=dis&&dis();
  const h=$(`<button class="st-h" aria-expanded="${!!s.open[key]}"${off?" disabled":""}><span class="word ${col}">${word}</span><small>${off?"بعد إكمال الحل":hint}</small><i>${CHEV}</i></button>`);
  sec.append(h);
  const b=$(`<div class="st-b"${s.open[key]?"":" hidden"}></div>`);sec.append(b);
  if(s.open[key])fill(b);
  h.onclick=()=>{s.open[key]=!s.open[key];h.setAttribute("aria-expanded",s.open[key]);b.hidden=!s.open[key];b.innerHTML="";if(s.open[key]){fill(b);sec.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}};
  return sec;
}
function trackHTML(p,s){
  const v=vals(p),n=p.subs.length,cols=`grid-template-columns:repeat(${2*n+1},minmax(0,1fr))`;
  let top="",bot="";
  for(let i=0;i<=n;i++){
    const last=i==n;
    // story row, right to left
    let cl="node hole",tx="·";
    if(last){cl="node known";tx=ar(v[i])}
    else if(s.checked){cl=i==0?"node ans":"node known";tx=ar(v[i])}
    else if(i==0){cl="node q";tx="؟"}
    top+=`<div class="${cl}">${tx}</div>`;
    // backward row: filled from the end
    const filled=i>=n-s.steps;
    bot+=`<div class="${filled?(i==0?"node ans":"node known"):"node hole"}${filled&&i==n-s.steps&&s.steps?" pop":""}">${filled?ar(v[i]):"·"}</div>`;
    if(!last){
      top+=`<div class="op dn"><span class="sg"><span>−</span><span>${ar(p.subs[i])}</span></span>${arrow("left")}</div>`;
      const shown=i>=n-s.steps;
      bot+=`<div class="op up${shown?(i==n-s.steps?" pop":""):" wait"}"><span class="sg"><span>+</span><span>${ar(p.subs[i])}</span></span>${arrow("right")}</div>`;
    }
  }
  return `<div class="lab">مَا حَدَثَ فِي الْمَسْأَلَةِ</div><div class="track" style="${cols}">${top}</div>
          <div class="lab up">أَحُلُّ بِاتِّجَاهٍ عَكْسِيٍّ</div><div class="track" style="${cols}">${bot}</div>`;
}
function solveBody(b){
  const p=P[cur],s=S[cur],v=vals(p),n=p.subs.length;
  let eqs="";
  for(let k=1;k<=s.steps;k++){const j=n-k;eqs+=eq(v[j+1],"+",p.subs[j],v[j],k==n)}
  b.innerHTML=trackHTML(p,s)+`<div class="eqs">${eqs}</div>`+
    `<p class="res">${p.ans[0]} <b>${s.steps==n?ar(v[0]):"&nbsp;"}</b> ${p.ans[1]}.</p>`;
  if(s.steps<n){
    const a=$(`<div class="act"><button class="btn">${s.steps?"الخطوة التالية":"أبدأ الحل"}</button></div>`);
    a.firstChild.onclick=()=>{s.steps++;solveBody(b);if(s.steps==n){const c=[...document.querySelectorAll(".st-h")][2];c.disabled=false;c.querySelector("small").textContent="هَلْ إِجَابَتِي مَعْقُولَةٌ؟"}};
    b.append(a);
  }
}
function checkBody(b){
  const p=P[cur],s=S[cur],v=vals(p);
  const wasChecked=s.checked;s.checked=true;
  let eqs="";p.subs.forEach((x,i)=>eqs+=eq(v[i],"−",x,v[i+1],false));
  b.innerHTML=`<div class="eqs">${eqs}</div><p class="res fine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l5 5L20 6"/></svg>وَصَلْتُ إِلَى ${p.back}، إِذَنْ إِجَابَتِي مَعْقُولَةٌ.</p>`;
  if(!wasChecked){const sb=[...document.querySelectorAll(".st-b")][1];if(sb&&!sb.hidden)solveBody(sb)}
}
addEventListener("resize",()=>drawInk());
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>drawInk());
renderTabs();render();
</script>
